<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" font-family="Inter,Arial,sans-serif">
<rect width="1060" height="400" fill="#ffffff"/>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cd6"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f9d57"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9730d"/></marker></defs>
<text x="30" y="40" fill="#121417" font-size="22" font-weight="800">Caminho do som do Mac Nicolly até a DM7</text>
<text x="30" y="64" fill="#555c66" font-size="14">Cabo USB (laranja), cabo de áudio (azul) e rede Dante (verde).</text>
<rect x="30" y="120" width="190" height="150" rx="14" fill="#1f242b"/>
<text x="125" y="160" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">Mac Nicolly</text>
<text x="125" y="184" text-anchor="middle" fill="#cfd4da" font-size="13">ProPresenter, vídeos,</text>
<text x="125" y="202" text-anchor="middle" fill="#cfd4da" font-size="13">músicas</text>
<rect x="45" y="222" width="160" height="32" rx="8" fill="#2a3038"/>
<text x="125" y="243" text-anchor="middle" fill="#ffd28a" font-size="12.5" font-weight="700">Saída: Audio CODEC</text>
<rect x="300" y="135" width="170" height="120" rx="14" fill="#2a3038"/>
<text x="385" y="180" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">Placa de áudio</text>
<text x="385" y="204" text-anchor="middle" fill="#cfd4da" font-size="13">no Mac aparece como</text>
<text x="385" y="222" text-anchor="middle" fill="#cfd4da" font-size="13">Audio CODEC</text>
<rect x="550" y="120" width="190" height="150" rx="14" fill="#1f242b"/>
<text x="645" y="165" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">DM3</text>
<text x="645" y="190" text-anchor="middle" fill="#cfd4da" font-size="13">mesa de som da</text>
<text x="645" y="208" text-anchor="middle" fill="#cfd4da" font-size="13">sala de transmissão</text>
<rect x="820" y="120" width="210" height="150" rx="14" fill="#1f242b"/>
<text x="925" y="165" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">DM7</text>
<text x="925" y="190" text-anchor="middle" fill="#cfd4da" font-size="13">mesa de som</text>
<text x="925" y="208" text-anchor="middle" fill="#cfd4da" font-size="13">da igreja</text>
<path d="M220 195 L298 195" stroke="#d9730d" stroke-width="5" marker-end="url(#ao)"/>
<text x="259" y="176" text-anchor="middle" fill="#d9730d" font-size="13" font-weight="800">USB</text>
<path d="M470 195 L548 195" stroke="#2b6cd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="509" y="176" text-anchor="middle" fill="#2b6cd6" font-size="12" font-weight="800">áudio</text>
<path d="M740 195 L818 195" stroke="#1f9d57" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#ag)"/>
<text x="779" y="176" text-anchor="middle" fill="#1f9d57" font-size="13" font-weight="800">Dante</text>
<text x="779" y="218" text-anchor="middle" fill="#1f9d57" font-size="11.5">pela rede</text>
<text x="125" y="310" text-anchor="middle" fill="#555c66" font-size="13">1. O som sai do Mac</text>
<text x="385" y="310" text-anchor="middle" fill="#555c66" font-size="13">2. A placa transforma em</text>
<text x="385" y="328" text-anchor="middle" fill="#555c66" font-size="13">som de cabo para a mesa</text>
<text x="645" y="310" text-anchor="middle" fill="#555c66" font-size="13">3. Entra num canal da DM3</text>
<text x="925" y="310" text-anchor="middle" fill="#555c66" font-size="13">4. Chega pela rede Dante</text>
<text x="925" y="328" text-anchor="middle" fill="#555c66" font-size="13">e sai no som da igreja</text>
</svg>
