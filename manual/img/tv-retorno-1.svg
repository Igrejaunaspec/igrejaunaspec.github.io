<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="Inter,Arial,sans-serif">
<rect width="1060" height="560" fill="#ffffff"/>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cd6"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f9d57"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9730d"/></marker></defs>
<text x="30" y="40" fill="#121417" font-size="22" font-weight="800">Como a imagem chega na TV de retorno</text>
<text x="30" y="64" fill="#555c66" font-size="14">Cabo de rede direto (verde), HDMI (azul) e o passador de slides (laranja). Não passa por roteador nem pela internet.</text>
<rect x="30" y="100" width="260" height="300" rx="14" fill="#1f242b"/>
<text x="160" y="138" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">Mac Nicolly</text>
<text x="160" y="160" text-anchor="middle" fill="#cfd4da" font-size="13">mesa de mídia · 3 telas</text>
<rect x="50" y="180" width="220" height="62" rx="10" fill="#2a3038"/>
<text x="160" y="205" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">App Retorno</text>
<text x="160" y="226" text-anchor="middle" fill="#cfd4da" font-size="12.5">pega a tela escolhida e manda</text>
<rect x="50" y="252" width="220" height="62" rx="10" fill="#2a3038"/>
<text x="160" y="277" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Seletor de telas (Passador)</text>
<text x="160" y="298" text-anchor="middle" fill="#cfd4da" font-size="12.5">ícone na barra de cima · localhost:8092</text>
<rect x="50" y="324" width="220" height="62" rx="10" fill="#1f9d57"/>
<text x="160" y="349" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="800">Adaptador USB 2.5G LAN</text>
<text x="160" y="370" text-anchor="middle" fill="#e6f6ec" font-size="12.5">endereço 192.168.10.1</text>
<rect x="30" y="420" width="260" height="110" rx="14" fill="#fff4e5" stroke="#d9730d" stroke-width="2"/>
<text x="160" y="450" text-anchor="middle" fill="#8a4a07" font-size="12.5" font-weight="800">Não mexer: adaptador USB 1000 LAN</text>
<text x="160" y="472" text-anchor="middle" fill="#8a4a07" font-size="12.5">é do som (rede Dante).</text>
<text x="160" y="492" text-anchor="middle" fill="#8a4a07" font-size="12.5">"IP autoatribuído" nele é normal.</text>
<rect x="420" y="160" width="250" height="200" rx="14" fill="#1f242b"/>
<text x="545" y="198" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">PC da frente</text>
<text x="545" y="220" text-anchor="middle" fill="#cfd4da" font-size="13">Linux, sem tela própria</text>
<text x="545" y="240" text-anchor="middle" fill="#cfd4da" font-size="13">endereço 192.168.10.2</text>
<rect x="440" y="258" width="210" height="44" rx="10" fill="#2a3038"/>
<text x="545" y="285" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">recebe e mostra na TV</text>
<rect x="440" y="308" width="210" height="40" rx="10" fill="#2a3038"/>
<text x="545" y="333" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">liga pelo botão dele</text>
<path d="M270 355 C340 355 350 230 418 230" fill="none" stroke="#1f9d57" stroke-width="5" marker-end="url(#ag)"/>
<text x="355" y="398" text-anchor="middle" fill="#1f9d57" font-size="13" font-weight="800">cabo de rede</text>
<text x="355" y="416" text-anchor="middle" fill="#1f9d57" font-size="12">imagem →  ← cliques</text>
<rect x="800" y="140" width="230" height="160" rx="12" fill="#121417"/>
<rect x="814" y="154" width="202" height="114" rx="6" fill="#2b6cd6" opacity=".35"/>
<text x="915" y="208" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">TV de retorno</text>
<text x="915" y="230" text-anchor="middle" fill="#dbe6fb" font-size="12.5">na frente da igreja</text>
<rect x="895" y="300" width="40" height="14" fill="#121417"/>
<path d="M670 230 L798 230" fill="none" stroke="#2b6cd6" stroke-width="5" marker-end="url(#ab)"/>
<text x="734" y="218" text-anchor="middle" fill="#2b6cd6" font-size="13" font-weight="800">HDMI</text>
<rect x="470" y="430" width="150" height="60" rx="12" fill="#fff4e5" stroke="#d9730d" stroke-width="2"/>
<text x="545" y="456" text-anchor="middle" fill="#8a4a07" font-size="14" font-weight="800">Passador (clicker)</text>
<text x="545" y="476" text-anchor="middle" fill="#8a4a07" font-size="12">receptor USB no PC</text>
<path d="M545 428 L545 362" fill="none" stroke="#d9730d" stroke-width="4" marker-end="url(#ao)"/>
<text x="800" y="400" fill="#555c66" font-size="13">Sem imagem chegando, a TV mostra</text>
<text x="800" y="420" fill="#121417" font-size="14" font-weight="800">"aguardando conexão".</text>
<text x="800" y="450" fill="#555c66" font-size="13">Tudo liga sozinho quando os</text>
<text x="800" y="468" fill="#555c66" font-size="13">dois computadores ligam.</text>
</svg>
