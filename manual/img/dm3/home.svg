<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Inter,Arial,sans-serif"><rect width="1100" height="560" fill="#fff"/><rect x="20" y="20" width="1060" height="480" rx="18" fill="#0b0d10"/><text x="50" y="60" fill="#fff" font-size="18" font-weight="800">Tela HOME · 8 canais</text><rect x="50" y="85" width="300" height="40" rx="8" fill="#2b6cd6"/><text x="66" y="111" fill="#8b929c" font-size="13" font-weight="700">a</text><text x="92" y="111" fill="#fff" font-size="15" font-weight="800">INPUT</text><text x="335" y="111" text-anchor="end" fill="#cfd4da" font-size="13">ganho</text><rect x="50" y="133" width="300" height="40" rx="8" fill="#1f242b"/><text x="66" y="159" fill="#8b929c" font-size="13" font-weight="700">b</text><text x="92" y="159" fill="#fff" font-size="15" font-weight="800">EQ</text><text x="335" y="159" text-anchor="end" fill="#cfd4da" font-size="13">graves/agudos</text><rect x="50" y="181" width="300" height="40" rx="8" fill="#1f242b"/><text x="66" y="207" fill="#8b929c" font-size="13" font-weight="700">c</text><text x="92" y="207" fill="#fff" font-size="15" font-weight="800">DYN1</text><text x="335" y="207" text-anchor="end" fill="#cfd4da" font-size="13">compressor</text><rect x="50" y="229" width="300" height="40" rx="8" fill="#1f242b"/><text x="66" y="255" fill="#8b929c" font-size="13" font-weight="700">d</text><text x="92" y="255" fill="#fff" font-size="15" font-weight="800">DYN2</text><text x="335" y="255" text-anchor="end" fill="#cfd4da" font-size="13"></text><rect x="50" y="277" width="300" height="40" rx="8" fill="#1f242b"/><text x="66" y="303" fill="#8b929c" font-size="13" font-weight="700">e</text><text x="92" y="303" fill="#fff" font-size="15" font-weight="800">DELAY</text><text x="335" y="303" text-anchor="end" fill="#cfd4da" font-size="13"></text><rect x="50" y="325" width="300" height="40" rx="8" fill="#1f242b"/><text x="66" y="351" fill="#8b929c" font-size="13" font-weight="700">f</text><text x="92" y="351" fill="#fff" font-size="15" font-weight="800">FX 1</text><text x="335" y="351" text-anchor="end" fill="#cfd4da" font-size="13">efeito</text><rect x="50" y="373" width="300" height="40" rx="8" fill="#1f242b"/><text x="66" y="399" fill="#8b929c" font-size="13" font-weight="700">g</text><text x="92" y="399" fill="#fff" font-size="15" font-weight="800">FX 2</text><text x="335" y="399" text-anchor="end" fill="#cfd4da" font-size="13"></text><rect x="50" y="421" width="300" height="40" rx="8" fill="#1f242b"/><text x="66" y="447" fill="#8b929c" font-size="13" font-weight="700">h</text><text x="92" y="447" fill="#fff" font-size="15" font-weight="800">SEND TO</text><text x="335" y="447" text-anchor="end" fill="#cfd4da" font-size="13">envios</text><text x="400" y="110" fill="#fff" font-size="16" font-weight="700">Cada caixa é uma parte do canal.</text><text x="400" y="138" fill="#cfd4da" font-size="15">Tocar numa caixa abre a tela dela.</text><text x="400" y="180" fill="#cfd4da" font-size="15">Para o ganho: toque em a · INPUT.</text><text x="400" y="222" fill="#cfd4da" font-size="15">EQ, DYN e FX: não mexa sem o responsável</text><text x="400" y="246" fill="#cfd4da" font-size="15">pelo som.</text><text x="400" y="290" fill="#cfd4da" font-size="15">Embaixo ficam os faders, ON e CUE de cada canal,</text><text x="400" y="314" fill="#cfd4da" font-size="15">e em cima de cada um, o nome do canal.</text><text x="400" y="358" fill="#cfd4da" font-size="15">A tecla HOME (ao lado da tela) volta para cá.</text><text x="550" y="540" text-anchor="middle" fill="#555c66" font-size="13">Desenho simplificado (a tela real tem mais caixas: INSERT, ASSIGN, AUTOMIXER, LIBRARY e CH VIEW)</text></svg>