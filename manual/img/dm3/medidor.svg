<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Inter,Arial,sans-serif"><rect width="1100" height="470" fill="#fff"/><text x="40" y="44" fill="#121417" font-size="22" font-weight="800">Como ler o medidor ao ajustar o ganho</text><rect x="150" y="80" width="56" height="280" rx="8" fill="#1f242b"/><rect x="158" y="88" width="40" height="21" rx="3" fill="#2a3038"/><rect x="158" y="115" width="40" height="21" rx="3" fill="#2a3038"/><rect x="158" y="142" width="40" height="21" rx="3" fill="#2a3038"/><rect x="158" y="169" width="40" height="21" rx="3" fill="#2a3038"/><rect x="158" y="196" width="40" height="21" rx="3" fill="#2a3038"/><rect x="158" y="223" width="40" height="21" rx="3" fill="#2a3038"/><rect x="158" y="250" width="40" height="21" rx="3" fill="#2a3038"/><rect x="158" y="277" width="40" height="21" rx="3" fill="#2a3038"/><rect x="158" y="304" width="40" height="21" rx="3" fill="#2a3038"/><rect x="158" y="331" width="40" height="21" rx="3" fill="#22c55e"/><text x="178" y="395" text-anchor="middle" fill="#d9730d" font-size="19" font-weight="800">Pouco ganho</text><text x="178" y="420" text-anchor="middle" fill="#555c66" font-size="13.5">quase não acende:</text><text x="178" y="440" text-anchor="middle" fill="#555c66" font-size="13.5">som fraco e com chiado</text><rect x="510" y="80" width="56" height="280" rx="8" fill="#1f242b"/><rect x="518" y="88" width="40" height="21" rx="3" fill="#2a3038"/><rect x="518" y="115" width="40" height="21" rx="3" fill="#2a3038"/><rect x="518" y="142" width="40" height="21" rx="3" fill="#2a3038"/><rect x="518" y="169" width="40" height="21" rx="3" fill="#2a3038"/><rect x="518" y="196" width="40" height="21" rx="3" fill="#22c55e"/><rect x="518" y="223" width="40" height="21" rx="3" fill="#22c55e"/><rect x="518" y="250" width="40" height="21" rx="3" fill="#22c55e"/><rect x="518" y="277" width="40" height="21" rx="3" fill="#22c55e"/><rect x="518" y="304" width="40" height="21" rx="3" fill="#22c55e"/><rect x="518" y="331" width="40" height="21" rx="3" fill="#22c55e"/><text x="538" y="395" text-anchor="middle" fill="#1f9d57" font-size="19" font-weight="800">Certo</text><text x="538" y="420" text-anchor="middle" fill="#555c66" font-size="13.5">verde até perto do meio,</text><text x="538" y="440" text-anchor="middle" fill="#555c66" font-size="13.5">amarelo só nos picos</text><rect x="870" y="80" width="56" height="280" rx="8" fill="#1f242b"/><rect x="878" y="88" width="40" height="21" rx="3" fill="#e03131"/><rect x="878" y="115" width="40" height="21" rx="3" fill="#f5b301"/><rect x="878" y="142" width="40" height="21" rx="3" fill="#f5b301"/><rect x="878" y="169" width="40" height="21" rx="3" fill="#22c55e"/><rect x="878" y="196" width="40" height="21" rx="3" fill="#22c55e"/><rect x="878" y="223" width="40" height="21" rx="3" fill="#22c55e"/><rect x="878" y="250" width="40" height="21" rx="3" fill="#22c55e"/><rect x="878" y="277" width="40" height="21" rx="3" fill="#22c55e"/><rect x="878" y="304" width="40" height="21" rx="3" fill="#22c55e"/><rect x="878" y="331" width="40" height="21" rx="3" fill="#22c55e"/><text x="898" y="395" text-anchor="middle" fill="#e03131" font-size="19" font-weight="800">Ganho demais</text><text x="898" y="420" text-anchor="middle" fill="#555c66" font-size="13.5">chega no vermelho (OVR):</text><text x="898" y="440" text-anchor="middle" fill="#555c66" font-size="13.5">o som distorce</text></svg>